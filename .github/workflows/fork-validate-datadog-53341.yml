name: Fork validation - Datadog V1 null points
on:
  push:
    branches:
      - fix/53341-datadog-null-points
  workflow_dispatch:

permissions:
  contents: read

jobs:
  datadog-v1-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: receiver/datadogreceiver/go.mod
          cache: false
      - name: Check Go formatting
        run: |
          test -z "$(gofmt -l receiver/datadogreceiver/internal/translator/series.go receiver/datadogreceiver/internal/translator/series_nil_points_test.go)"
      - name: Run regression tests with race detector
        working-directory: receiver/datadogreceiver
        run: go test -count=1 -race ./internal/translator -run '^TestTranslateSeriesV1(SkipsNullPoints|OnlyNullPoints)$'
      - name: Run complete translator unit tests
        working-directory: receiver/datadogreceiver
        run: go test -count=1 ./internal/translator
